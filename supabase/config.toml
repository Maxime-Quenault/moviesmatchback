project_id = "moviesmatch-tests"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = false

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 3600
max_frequency = "1s"

[auth.email.template.magic_link]
subject = "Ton code Moma"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.confirmation]
subject = "Verifie ton email Moma"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.recovery]
subject = "Reinitialiser ton mot de passe Moma"
content_path = "./supabase/templates/recovery.html"

# Isolated test stack only; production retains its own anti-abuse limits.
[auth.rate_limit]
email_sent = 100
token_verifications = 100
sign_in_sign_ups = 100
